[project]
name = "immune-harness"
version = "0.1.0"
description = "Self-evolving security harness for AI agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "typesafe-sdk",
    "openai",
    "pymongo",
    "pydantic",
    "python-dotenv",
    "streamlit",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
