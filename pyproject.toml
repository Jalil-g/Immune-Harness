[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immune-harness-db"
version = "0.1.0"
description = "Atlas persistence, shared contracts, and policy cache for Immune Harness"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pymongo>=4.10,<5",
  "dnspython>=2.6,<3",
  "python-dotenv>=1,<2",
  "fastapi",
  "uvicorn",
  "typesafe-sdk",
  "openai",
  "streamlit",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
immune-db = "db.atlas:main"

[tool.setuptools.packages.find]
include = ["db*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires MONGODB_TEST_URI pointing at a replica set or Atlas"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["ARCHITECTURE.md"]
