# Dashboard theme (dashboard/app.py). Colours match dashboard/ui/styles.py.
[theme]
base = "light"
primaryColor = "#1c3ab5"
backgroundColor = "#f3efe6"
secondaryBackgroundColor = "#ebe6da"
textColor = "#15171c"
borderColor = "#b9b09b"
baseRadius = "4px"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
