# Dashboard theme (dashboard/app.py). Colours match dashboard/ui/styles.py.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0a0b0f"
secondaryBackgroundColor = "#12141a"
textColor = "#eef0f5"
borderColor = "rgba(255,255,255,0.08)"
baseRadius = "12px"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
